[project]
name = "t2t-ml"
version = "0.0.0"
description = "T2T trash-classification service (FastAPI) + pipelines"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "transformers>=4.44",
    "torch>=2.4",           # CPU build by default on Windows/PyPI
    "pillow>=10.4",
    "python-multipart>=0.0.9",
    "gunicorn>=23.0",        # prod serving (Linux); dev on Windows uses uvicorn
]

[tool.uv]
package = false
