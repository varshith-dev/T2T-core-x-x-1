[project]
name = "t2t-monitor"
version = "0.0.0"
description = "Windows GUI to observe the T2T pipeline: API calls, ML guesses, DB tables"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "requests>=2.32",
    "sv-ttk>=2.6",
]

[dependency-groups]
dev = ["pyinstaller>=6.11"]

[tool.uv]
package = false
